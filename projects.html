<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Mahmoud Maher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800;900&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* ===== PAGE-SPECIFIC STYLES ===== */

  .page-hero {
    padding: 160px 8vw 80px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .page-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(0,255,100,0.07) 0%, transparent 60%);
    pointer-events: none;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 48px;
    transition: color 0.3s var(--ease);
  }
  .back-link:hover { color: var(--green); }
  .back-link svg { width: 16px; height: 16px; }

  /* ===== PROJECTS GRID ===== */
  .proj-section {
    padding: 0 8vw 140px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .proj-filters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 60px;
  }

  .proj-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }

  /* ===== CARD ===== */
  .proj-card {
    position: relative;
    opacity: 0;
    transform: translateY(36px);
    transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
    cursor: none;
  }
  .proj-card.visible { opacity: 1; transform: translateY(0); }
  .proj-card.featured { grid-column: span 2; }
  .proj-card.hidden { display: none; }

  /* outer wrapper — overflow VISIBLE so scale is never clipped */
  .proj-card-wrap {
    overflow: visible;
    position: relative;
  }

  /* cover: overflow hidden lives here */
  .proj-cover {
    overflow: hidden;
    border-radius: 12px;
    aspect-ratio: 4 / 3;
    position: relative;
    border: 1px solid rgba(255,255,255,0.05);
    transition:
      box-shadow   400ms cubic-bezier(0.25,0.46,0.45,0.94),
      border-color 400ms cubic-bezier(0.25,0.46,0.45,0.94);
  }
  .proj-card.featured .proj-cover { aspect-ratio: 16 / 9; }
  .proj-card:hover .proj-cover {
    border-color: var(--green);
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(0,255,100,0.2);
  }
  /* scale applied to the inner cover so it can't escape its own clip */
  .proj-cover-bg {
    position: absolute; inset: 0;
    transition: transform 500ms cubic-bezier(0.25,0.46,0.45,0.94);
  }
  .proj-card:hover .proj-cover-bg { transform: scale(1.06); }

  .proj-cover-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: clamp(1.4rem, 3vw, 2.6rem);
    color: rgba(255,255,255,0.12);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 24px;
    text-align: center;
    pointer-events: none;
    line-height: 1.1;
  }

  /* hover overlay */
  .proj-hover {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,255,100,0.18) 0%, rgba(0,0,0,0.55) 100%);
    display: flex;
    align-items: flex-end;
    padding: 28px;
    opacity: 0;
    transition: opacity 400ms cubic-bezier(0.25,0.46,0.45,0.94);
  }
  .proj-card:hover .proj-hover { opacity: 1; }
  .proj-view-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.25em;
    color: var(--green);
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--green);
    padding: 10px 22px;
    border-radius: 999px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
  }

  /* card info */
  .proj-info {
    padding: 16px 2px 0;
  }
  .proj-cat-tag {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--green);
    border: 1px solid rgba(0,255,100,0.3);
    border-radius: 999px;
    padding: 4px 12px;
    margin-bottom: 10px;
  }
  .proj-title-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.3rem;
    color: var(--white);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    line-height: 1.1;
    margin-bottom: 6px;
  }
  .proj-client-text {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.8rem;
    color: #777;
    letter-spacing: 0.04em;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 1100px) {
    .proj-grid { grid-template-columns: repeat(2, 1fr); }
    .proj-card.featured { grid-column: span 2; }
  }
  @media (max-width: 700px) {
    .proj-grid { grid-template-columns: 1fr; gap: 20px; }
    .proj-card.featured { grid-column: span 1; }
    .proj-section { padding: 0 16px 100px; }
    .page-hero { padding: 130px 16px 60px; }
    .proj-card { cursor: pointer; }
  }
</style>
</head>
<body>

<div class="page-fade"></div>
<div class="cursor-dot"></div>
<div class="cursor-circle"></div>

<nav class="nav" id="nav">
  <a href="index.html" class="brand" data-hover>M.M<span class="dot">.</span></a>
  <div class="links" id="navLinks">
    <a href="index.html" data-hover>Home</a>
    <a href="index.html#about" data-hover>About</a>
    <a href="projects.html" data-hover style="color: var(--green);">Work</a>
    <a href="index.html#services" data-hover>Services</a>
    <a href="index.html#contact" data-hover>Contact</a>
  </div>
  <button class="hamburger" id="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- PAGE HERO -->
<section class="page-hero">
  <a href="index.html" class="back-link" data-hover>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="11 18 5 12 11 6"/>
    </svg>
    Back to Home
  </a>
  <div class="section-label reveal-up" style="justify-content:center;display:inline-flex;margin-bottom:14px;">Portfolio</div>
  <h1 class="section-title" style="font-size:clamp(3rem,8vw,7rem);line-height:0.92;">My <span class="accent">Projects.</span></h1>
  <p style="font-family:'Inter',sans-serif;font-weight:300;font-size:1rem;color:#888;max-width:560px;margin:24px auto 0;line-height:1.7;">
    A curated collection spanning Key Visuals, Social Media Campaigns, Infographics, and Film Posters — crafted for brands across Egypt and the GCC.
  </p>
</section>

<!-- PROJECTS -->
<section class="proj-section">
  <!-- Filters -->
  <div class="proj-filters" id="projFilters">
    <button class="filter-btn active" data-filter="all" data-hover>All</button>
    <button class="filter-btn" data-filter="key" data-hover>Key Visuals</button>
    <button class="filter-btn" data-filter="social" data-hover>Social Media</button>
    <button class="filter-btn" data-filter="info" data-hover>Infographics</button>
    <button class="filter-btn" data-filter="film" data-hover>Film Posters</button>
  </div>

  <!-- Grid -->
  <div class="proj-grid" id="projGrid"></div>
</section>

<footer class="site-footer">
  <p class="copy">&copy; 2025 Mahmoud Maher. All rights reserved.</p>
  <p class="built">Designed &amp; Built with passion.</p>
</footer>

<script src="js/projects-data.js"></script>
<script>
  /* Cursor */
  const dot   = document.querySelector('.cursor-dot');
  const circle = document.querySelector('.cursor-circle');
  let mx = innerWidth/2, my = innerHeight/2, cx = mx, cy = my;
  addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx}px,${my}px) translate(-50%,-50%)`;
  });
  (function tick() {
    cx += (mx-cx)*0.14; cy += (my-cy)*0.14;
    circle.style.transform = `translate(${cx}px,${cy}px) translate(-50%,-50%)`;
    requestAnimationFrame(tick);
  })();
  function addHover(els) {
    els.forEach(el => {
      el.addEventListener('mouseenter', () => circle.classList.add('hover'));
      el.addEventListener('mouseleave', () => circle.classList.remove('hover'));
    });
  }
  addHover(document.querySelectorAll('a, button, [data-hover]'));

  /* Navbar */
  const nav = document.getElementById('nav');
  const hamburger = document.getElementById('hamburger');
  addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 40));
  hamburger.addEventListener('click', () => nav.classList.toggle('open'));
  document.querySelectorAll('#navLinks a').forEach(a =>
    a.addEventListener('click', () => nav.classList.remove('open'))
  );

  /* Build grid */
  const grid = document.getElementById('projGrid');

  PROJECTS.forEach((p, i) => {
    const card = document.createElement('article');
    card.className = 'proj-card' + (p.featured ? ' featured' : '');
    card.dataset.category = p.category;
    card.style.transitionDelay = `${i * 0.08}s`;

    card.innerHTML = `
      <div class="proj-card-wrap">
        <div class="proj-cover">
          <div class="proj-cover-bg" style="background:${p.coverGrad}"></div>
          <div class="proj-cover-text">${p.title}</div>
          <div class="proj-hover">
            <span class="proj-view-btn">View Project &rarr;</span>
          </div>
        </div>
        <div class="proj-info">
          <span class="proj-cat-tag">${p.categoryLabel}</span>
          <div class="proj-title-text">${p.title}</div>
          <div class="proj-client-text">${p.client}</div>
        </div>
      </div>
    `;

    card.addEventListener('click', () => {
      window.location.href = `project-detail.html?id=${p.id}`;
    });

    grid.appendChild(card);
  });

  /* Stagger reveal on load */
  requestAnimationFrame(() => {
    document.querySelectorAll('.proj-card').forEach(c => c.classList.add('visible'));
  });

  /* Filters */
  const filterBtns = document.querySelectorAll('#projFilters .filter-btn');
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      document.querySelectorAll('.proj-card').forEach(card => {
        card.classList.toggle('hidden', f !== 'all' && card.dataset.category !== f);
      });
    });
  });

  addHover(document.querySelectorAll('.proj-card, .proj-view-btn'));
</script>
</body>
</html>

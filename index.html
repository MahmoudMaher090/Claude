<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahmoud Maher — Visual Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0A0A0A;
    --gold: #C9A84C;
    --gold-soft: rgba(201, 168, 76, 0.6);
    --text: #EAEAEA;
    --muted: #8a8a8a;
    --ease: cubic-bezier(0.7, 0, 0.3, 1);
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100%;
    overflow: hidden;
    cursor: none;
  }

  a, button { cursor: none; color: inherit; text-decoration: none; }

  /* Page fade-in */
  .page-fade {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10000;
    pointer-events: none;
    animation: pageFade 1.4s var(--ease) forwards;
  }
  @keyframes pageFade {
    0%   { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
  }

  /* Custom cursor */
  .cursor-dot, .cursor-circle {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    mix-blend-mode: difference;
  }
  .cursor-dot {
    width: 5px; height: 5px;
    background: var(--gold);
  }
  .cursor-circle {
    width: 36px; height: 36px;
    border: 1px solid var(--gold);
    transition: width 0.35s var(--ease), height 0.35s var(--ease), background 0.35s var(--ease), border-color 0.35s var(--ease);
  }
  .cursor-circle.hover {
    width: 64px; height: 64px;
    background: rgba(201, 168, 76, 0.1);
  }

  /* Hero */
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #particles {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.9) 100%);
    z-index: 2;
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 0 32px;
    max-width: 1100px;
  }

  /* Reveal animation */
  .reveal {
    opacity: 0;
    transform: translateY(28px);
    animation: reveal 1.2s var(--ease) forwards;
  }
  .reveal.d1 { animation-delay: 0.6s; }
  .reveal.d2 { animation-delay: 1.0s; }
  .reveal.d3 { animation-delay: 1.4s; }
  .reveal.d4 { animation-delay: 1.8s; }
  .reveal.d5 { animation-delay: 2.2s; }

  @keyframes reveal {
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.7rem;
    letter-spacing: 0.6em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 36px;
    opacity: 0.9;
  }

  /* Decorative line */
  .line {
    width: 80px;
    height: 1px;
    background: var(--gold);
    margin: 0 auto;
    opacity: 0.7;
    transform-origin: center;
    animation: lineGrow 1.6s var(--ease) 0.4s forwards;
    transform: scaleX(0);
  }
  @keyframes lineGrow {
    to { transform: scaleX(1); }
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(3rem, 9vw, 7.5rem);
    letter-spacing: 0.18em;
    color: var(--gold);
    line-height: 1.05;
    margin: 38px 0 28px;
    text-shadow: 0 0 40px rgba(201, 168, 76, 0.15);
  }

  .name .space { display: inline-block; width: 0.4em; }

  /* Tagline */
  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.15rem, 2vw, 1.6rem);
    letter-spacing: 0.18em;
    color: var(--muted);
    margin-top: 8px;
    height: 1.6em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
  }

  .tagline .prefix {
    color: var(--muted);
  }

  .crossfade {
    position: relative;
    display: inline-block;
    height: 1.6em;
    min-width: 9em;
    text-align: left;
  }
  .crossfade span {
    position: absolute;
    left: 0; top: 0;
    color: var(--gold);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
    white-space: nowrap;
  }
  .crossfade span.active {
    opacity: 1;
    transform: translateY(0);
  }

  /* Bottom decorative line */
  .line-bottom {
    width: 1px;
    height: 60px;
    background: var(--gold-soft);
    margin: 56px auto 0;
    transform-origin: top;
    transform: scaleY(0);
    animation: lineDown 1.4s var(--ease) 1.6s forwards;
  }
  @keyframes lineDown {
    to { transform: scaleY(1); }
  }

  /* CTA */
  .cta {
    display: inline-block;
    margin-top: 48px;
    padding: 18px 48px;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.7rem;
    letter-spacing: 0.5em;
    color: var(--gold);
    border: 1px solid var(--gold-soft);
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    transition: color 0.5s var(--ease), border-color 0.5s var(--ease), letter-spacing 0.5s var(--ease);
  }
  .cta::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.6s var(--ease);
    z-index: -1;
  }
  .cta:hover {
    color: #0A0A0A;
    border-color: var(--gold);
    letter-spacing: 0.55em;
  }
  .cta:hover::before {
    transform: scaleX(1);
    transform-origin: left;
  }

  /* Scroll hint */
  .scroll-hint {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.6rem;
    letter-spacing: 0.5em;
    color: var(--gold);
    opacity: 0;
    text-transform: uppercase;
    animation: reveal 1.4s var(--ease) 2.6s forwards;
  }

  @media (max-width: 600px) {
    body { cursor: auto; }
    .cursor-dot, .cursor-circle { display: none; }
    a, button { cursor: pointer; }
    .cta { padding: 14px 32px; letter-spacing: 0.4em; }
  }
</style>
</head>
<body>

<div class="page-fade"></div>
<div class="cursor-dot"></div>
<div class="cursor-circle"></div>

<section class="hero">
  <canvas id="particles"></canvas>
  <div class="vignette"></div>

  <div class="hero-content">
    <div class="eyebrow reveal d1">Visual Designer &middot; Cairo</div>
    <div class="line"></div>
    <h1 class="name reveal d2">MAHMOUD<span class="space"></span>MAHER</h1>
    <div class="tagline reveal d3">
      <span class="prefix">I craft</span>
      <span class="crossfade" id="crossfade">
        <span class="active">Key Visuals</span>
        <span>Social Media</span>
        <span>Film Posters</span>
        <span>AI-Powered</span>
      </span>
    </div>
    <div>
      <a href="#work" class="cta reveal d4" data-hover>View My Work</a>
    </div>
  </div>

  <div class="scroll-hint">Scroll</div>
</section>

<script>
  /* Custom cursor */
  const dot = document.querySelector('.cursor-dot');
  const circle = document.querySelector('.cursor-circle');
  let mx = innerWidth/2, my = innerHeight/2;
  let cx = mx, cy = my;

  addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx}px, ${my}px) translate(-50%, -50%)`;
  });

  (function tick() {
    cx += (mx - cx) * 0.14;
    cy += (my - cy) * 0.14;
    circle.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
    requestAnimationFrame(tick);
  })();

  document.querySelectorAll('a, button, [data-hover]').forEach(el => {
    el.addEventListener('mouseenter', () => circle.classList.add('hover'));
    el.addEventListener('mouseleave', () => circle.classList.remove('hover'));
  });

  /* Crossfade cycling text */
  const cf = document.getElementById('crossfade');
  const items = cf.querySelectorAll('span');
  let idx = 0;
  setInterval(() => {
    items[idx].classList.remove('active');
    idx = (idx + 1) % items.length;
    items[idx].classList.add('active');
  }, 2800);

  /* Subtle particles */
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
  }
  resize();
  addEventListener('resize', resize);

  const COUNT = 30;
  const particles = Array.from({ length: COUNT }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.12,
    vy: (Math.random() - 0.5) * 0.12,
    r: Math.random() * 1.2 + 0.3,
    a: Math.random() * 0.35 + 0.08,
    twinkle: Math.random() * Math.PI * 2,
  }));

  function loop(t) {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -5) p.x = W + 5;
      if (p.x > W + 5) p.x = -5;
      if (p.y < -5) p.y = H + 5;
      if (p.y > H + 5) p.y = -5;

      const flicker = 0.5 + 0.5 * Math.sin(t * 0.0008 + p.twinkle);
      const alpha = p.a * (0.5 + flicker * 0.5);

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(201, 168, 76, ${alpha})`;
      ctx.shadowColor = 'rgba(201, 168, 76, 0.6)';
      ctx.shadowBlur = 6;
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahmoud Maher — Senior Graphic Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800;900&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0A0A0A;
    --green: #00FF64;
    --green-soft: rgba(0, 255, 100, 0.15);
    --gold: #C9A84C;
    --white: #FFFFFF;
    --muted: #9a9a9a;
    --ease: cubic-bezier(0.7, 0, 0.3, 1);
  }

  html, body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    height: 100%;
    overflow: hidden;
    cursor: none;
  }

  a, button { cursor: none; color: inherit; text-decoration: none; border: none; background: none; }

  /* Page fade-in */
  .page-fade {
    position: fixed; inset: 0;
    background: #000;
    z-index: 10000;
    pointer-events: none;
    animation: pageFade 1.2s var(--ease) forwards;
  }
  @keyframes pageFade {
    0%   { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
  }

  /* Cursor */
  .cursor-dot, .cursor-circle {
    position: fixed; top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    mix-blend-mode: difference;
  }
  .cursor-dot { width: 5px; height: 5px; background: var(--gold); }
  .cursor-circle {
    width: 36px; height: 36px;
    border: 1px solid var(--gold);
    transition: width 0.35s var(--ease), height 0.35s var(--ease), background 0.35s var(--ease);
  }
  .cursor-circle.hover {
    width: 64px; height: 64px;
    background: rgba(201, 168, 76, 0.1);
  }

  /* Hero */
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    perspective: 1600px;
  }

  /* Background ambient grain */
  .grain {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 80%, rgba(0,255,100,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 20% 20%, rgba(255,255,255,0.02) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Cards container — bottom half, behind text */
  .cards-stage {
    position: absolute;
    left: 50%;
    bottom: -8vh;
    transform: translateX(-50%);
    width: min(1500px, 100%);
    height: 65vh;
    transform-style: preserve-3d;
    z-index: 1;
    pointer-events: none;
  }

  .cards-row {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.4s var(--ease);
  }

  .center-glow {
    position: absolute;
    left: 50%; top: 30%;
    width: 600px;
    height: 600px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--green-soft) 0%, transparent 60%);
    filter: blur(20px);
    z-index: 0;
    pointer-events: none;
    animation: glowPulse 6s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
  }

  .card {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 220px;
    height: 330px;
    border-radius: 14px;
    overflow: hidden;
    transform-style: preserve-3d;
    transform-origin: center center;
    pointer-events: auto;
    box-shadow:
      0 20px 50px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.04) inset;
    transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease);
    opacity: 0;
    animation: cardRise 1.2s var(--ease) forwards;
  }
  @keyframes cardRise {
    from { opacity: 0; transform: var(--rest) translateY(60px); }
    to   { opacity: 1; transform: var(--rest); }
  }

  .card .img {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
  }
  .card .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
  }
  .card .meta {
    position: absolute;
    left: 16px; right: 16px; bottom: 14px;
    color: #fff;
  }
  .card .cat {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .card .title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .card .tint {
    position: absolute; inset: 0;
    background: rgba(0, 255, 100, 0);
    transition: background 0.5s var(--ease);
    pointer-events: none;
  }
  .card:hover {
    transform: var(--rest) scale(1.08) !important;
    box-shadow:
      0 30px 70px rgba(0,0,0,0.8),
      0 0 60px rgba(0,255,100,0.35),
      0 0 0 1px rgba(0,255,100,0.4) inset;
    z-index: 10;
  }
  .card:hover .tint {
    background: rgba(0, 255, 100, 0.12);
  }

  /* Hero content — text */
  .content {
    position: relative;
    z-index: 5;
    padding: 14vh 32px 0;
    text-align: center;
    max-width: 1100px;
    margin: 0 auto;
    pointer-events: none;
  }
  .content > * { pointer-events: auto; }

  .reveal {
    opacity: 0;
    transform: translateY(-24px);
    animation: reveal 1.1s var(--ease) forwards;
  }
  .reveal.d1 { animation-delay: 0.4s; }
  .reveal.d2 { animation-delay: 0.7s; }
  .reveal.d3 { animation-delay: 1.0s; }
  .reveal.d4 { animation-delay: 1.3s; }
  @keyframes reveal {
    to { opacity: 1; transform: translateY(0); }
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1rem;
    letter-spacing: 0.12em;
    color: var(--gold);
    margin-bottom: 22px;
  }
  .subtitle::before {
    content: '— ';
    color: var(--gold);
    opacity: 0.6;
  }
  .subtitle::after {
    content: ' —';
    color: var(--gold);
    opacity: 0.6;
  }

  .headline {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: clamp(2.6rem, 7.5vw, 6.4rem);
    line-height: 0.95;
    letter-spacing: 0.01em;
    color: var(--white);
    text-transform: uppercase;
  }
  .headline .accent {
    color: var(--green);
    font-style: italic;
    font-weight: 700;
  }

  .body-text {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 1rem;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin-top: 22px;
    max-width: 540px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
  }

  /* CTA pill */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin-top: 36px;
    padding: 14px 28px 14px 32px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(6px);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--white);
    transition: background 0.4s var(--ease), border-color 0.4s var(--ease), color 0.4s var(--ease), transform 0.4s var(--ease);
  }
  .cta .arrow {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--green);
    color: #0A0A0A;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.4s var(--ease);
  }
  .cta .arrow svg { width: 14px; height: 14px; }
  .cta:hover {
    background: rgba(0,255,100,0.08);
    border-color: var(--green);
    color: var(--green);
  }
  .cta:hover .arrow { transform: translateX(4px); }

  /* Scroll hint */
  .scroll-hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    font-size: 0.6rem;
    font-weight: 400;
    letter-spacing: 0.5em;
    color: var(--muted);
    text-transform: uppercase;
    opacity: 0;
    animation: reveal 1s var(--ease) 1.6s forwards;
  }
  .scroll-hint::after {
    content: '';
    display: block;
    width: 1px; height: 28px;
    background: var(--green);
    margin: 10px auto 0;
    transform-origin: top;
    animation: scrollLine 2s ease-in-out infinite;
  }
  @keyframes scrollLine {
    0%, 100% { transform: scaleY(0.3); opacity: 0.3; }
    50%      { transform: scaleY(1);   opacity: 1; }
  }

  @media (max-width: 768px) {
    body { cursor: auto; }
    .cursor-dot, .cursor-circle { display: none; }
    a, button { cursor: pointer; }
    .card { width: 130px; height: 195px; }
    .cards-stage { height: 50vh; bottom: -4vh; }
    .center-glow { width: 360px; height: 360px; }
  }
</style>
</head>
<body>

<div class="page-fade"></div>
<div class="cursor-dot"></div>
<div class="cursor-circle"></div>

<section class="hero">
  <div class="grain"></div>

  <div class="cards-stage">
    <div class="center-glow"></div>
    <div class="cards-row" id="cardsRow"></div>
  </div>

  <div class="content">
    <div class="subtitle reveal d1">Senior Graphic Designer &middot; Cairo</div>
    <h1 class="headline reveal d2">
      Crafting Visuals,<br>
      Telling <span class="accent">Stories</span>
    </h1>
    <p class="body-text reveal d3">
      Impactful visuals that combine strategy, style, and speed.
    </p>
    <a href="#work" class="cta reveal d4" data-hover>
      View My Work
      <span class="arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="13 6 19 12 13 18"/>
        </svg>
      </span>
    </a>
  </div>

  <div class="scroll-hint">Scroll</div>
</section>

<script>
  /* Custom cursor */
  const dot = document.querySelector('.cursor-dot');
  const circle = document.querySelector('.cursor-circle');
  let mx = innerWidth / 2, my = innerHeight / 2;
  let cx = mx, cy = my;

  addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx}px, ${my}px) translate(-50%, -50%)`;
  });
  (function tick() {
    cx += (mx - cx) * 0.14;
    cy += (my - cy) * 0.14;
    circle.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
    requestAnimationFrame(tick);
  })();
  document.querySelectorAll('a, button, [data-hover]').forEach(el => {
    el.addEventListener('mouseenter', () => circle.classList.add('hover'));
    el.addEventListener('mouseleave', () => circle.classList.remove('hover'));
  });

  /* Cards data — 5 placeholder gradients */
  const CARDS = [
    { cat: 'Film Poster', title: 'Crimson Hour', grad: 'linear-gradient(135deg, #6B0F1A 0%, #1a1a1a 100%)' },
    { cat: 'Key Visual',  title: 'Northern Echo', grad: 'linear-gradient(135deg, #0a3d62 0%, #060f1a 100%)' },
    { cat: 'AI Concept',  title: 'Neon Verdant',  grad: 'linear-gradient(135deg, #0b6b3a 0%, #051f12 100%)' },
    { cat: 'Social Campaign', title: 'Velvet Pulse', grad: 'linear-gradient(135deg, #4a1d6b 0%, #110620 100%)' },
    { cat: 'Brand Identity', title: 'Solar Drift', grad: 'linear-gradient(135deg, #b8741a 0%, #1f1206 100%)' },
  ];

  /* Curved arrangement: x offset, y offset (curve), rotateY, z, base delay */
  const POSITIONS = [
    { x: -440, y: 70,  ry: 28,  z: -120, delay: 0.6 },
    { x: -220, y: 30,  ry: 14,  z: -40,  delay: 0.8 },
    { x: 0,    y: 0,   ry: 0,   z: 40,   delay: 1.0 },
    { x: 220,  y: 30,  ry: -14, z: -40,  delay: 1.2 },
    { x: 440,  y: 70,  ry: -28, z: -120, delay: 1.4 },
  ];

  const row = document.getElementById('cardsRow');
  const cardEls = [];

  CARDS.forEach((c, i) => {
    const p = POSITIONS[i];
    const el = document.createElement('a');
    el.href = '#work';
    el.className = 'card';
    el.setAttribute('data-hover', '');
    const rest = `translateX(calc(-50% + ${p.x}px)) translateY(${p.y}px) translateZ(${p.z}px) rotateY(${p.ry}deg)`;
    el.style.setProperty('--rest', rest);
    el.style.transform = rest;
    el.style.animationDelay = p.delay + 's';
    el.dataset.phase = (i * 1.1).toString();
    el.dataset.basex = p.x;
    el.dataset.basey = p.y;
    el.dataset.basez = p.z;
    el.dataset.ry   = p.ry;

    el.innerHTML = `
      <div class="img" style="background: ${c.grad}"></div>
      <div class="tint"></div>
      <div class="overlay"></div>
      <div class="meta">
        <div class="cat">${c.cat}</div>
        <div class="title">${c.title}</div>
      </div>
    `;
    row.appendChild(el);
    cardEls.push(el);
  });

  /* Float animation + mouse parallax */
  let parX = 0, parY = 0;
  let curParX = 0, curParY = 0;

  addEventListener('mousemove', e => {
    parX = (e.clientX / innerWidth - 0.5) * 2;   // -1 .. 1
    parY = (e.clientY / innerHeight - 0.5) * 2;
  });

  const start = performance.now();
  function animateCards(now) {
    const t = (now - start) / 1000;
    curParX += (parX - curParX) * 0.06;
    curParY += (parY - curParY) * 0.06;

    for (const el of cardEls) {
      const phase = parseFloat(el.dataset.phase);
      const bx = parseFloat(el.dataset.basex);
      const by = parseFloat(el.dataset.basey);
      const bz = parseFloat(el.dataset.basez);
      const ry = parseFloat(el.dataset.ry);

      const floatY = Math.sin(t * 0.9 + phase) * 14;
      const floatX = Math.cos(t * 0.6 + phase) * 6;
      const px = curParX * 28;
      const py = curParY * 18;

      const rest = `translateX(calc(-50% + ${bx + floatX + px}px)) translateY(${by + floatY + py}px) translateZ(${bz}px) rotateY(${ry - curParX * 4}deg) rotateX(${-curParY * 3}deg)`;
      el.style.setProperty('--rest', rest);
      if (!el.matches(':hover')) {
        el.style.transform = rest;
      }
    }
    requestAnimationFrame(animateCards);
  }
  requestAnimationFrame(animateCards);
</script>

</body>
</html>
